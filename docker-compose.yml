version: '3.9'
services:
  postgres:
    image: postgres:15-alpine
    container_name: lifeline_db
    environment:
      POSTGRES_DB: lifeline_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - lifeline_pg_data:/var/lib/postgresql/data
    restart: unless-stopped

  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: evolution-api
    environment:
      AUTHENTICATION_API_KEY: lifeline-secret-key
      DATABASE_ENABLED: "false"
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  lifeline_pg_data:
